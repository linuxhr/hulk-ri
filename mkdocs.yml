site_name: HULK Rijeka
site_url: https://www.ri.linux.hr/
site_description: Riječka podružnica Hrvatske udruge Linux korisnika
site_author: Hrvatska udruga Linux korisnika
copyright: >-
  Copyright &copy; 1998 -- 2019 <a href="http://www.linux.hr/">Hrvatska udruga
  Linux korisnika</a>. All rights reserved. Source code
  <a href="https://github.com/linuxhr/hulk-ri">available</a>. Mirrored on
  <a href="https://pages.github.com/">GitHub Pages</a>; deployed using
  <a href="https://gaseri.org/en/blog/2026-04-14-the-future-of-mkdocs-properdocs-and-zensical/#zensical">GitHub Actions workflow from GASERI</a>.

theme:
  name: material
  variant: classic
  language: hr
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - social
  - blog:
      blog_dir: .
      blog_toc: true
      post_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          normalize: NFC
  - tags
  - rss:
      match_path: posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
  - redirects:
      redirect_maps:
        'podruznica.md': 'podružnica.md'
        # Blog category URLs, including generated pagination pages
        'category/podruznica.md': 'category/podružnica.md'
        'category/podruznica/page/2.md': 'category/podružnica/page/2.md'
        'category/sveuciliste.md': 'category/sveučilište.md'
        'category/sveuciliste/page/2.md': 'category/sveučilište/page/2.md'
        'category/sveuciliste/page/3.md': 'category/sveučilište/page/3.md'
